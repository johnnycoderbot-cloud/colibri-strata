name: Strata experimental core

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'c/strata_*.h'
      - 'c/strata_native_heads.c'
      - 'c/qwen36.c'
      - 'c/qwen36_strata.h'
      - 'c/qwen36_mtp*.h'
      - 'c/spec_draft.h'
      - 'c/idot.h'
      - 'c/tools/native_optimization_bench.py'
      - 'c/tools/native_moe_prefetch_bench.py'
      - 'c/olmoe.c'
      - 'c/tests/test_olmoe_cache_index.c'
      - 'c/tests/test_idot_multi_rows.c'
      - 'c/tests/test_idot_wide.c'
      - 'c/tools/*native*heads.py'
      - 'c/tools/native_decode_bench.py'
      - 'c/tools/convert_qwen36.py'
      - 'c/tests/test_*native*'
      - 'c/tests/*frontier*'
      - 'c/tests/test_qwen36_*'
      - 'c/tests/test_convert_qwen36_tied.py'
      - 'c/tests/test_convert_qwen36_mtp.py'
      - 'c/tests/test_sequential_mtp_cli.py'
      - 'c/tests/*strata*'
      - 'c/Makefile'
      - 'c/coli'
      - 'c/tools/clean.py'
      - 'c/tests/test_parallel_heads_cli.py'
      - 'c/family_registry.py'
      - 'experimental/strata/**'
      - '.github/workflows/strata-core.yml'
  pull_request:
    paths:
      - 'c/strata_*.h'
      - 'c/strata_native_heads.c'
      - 'c/qwen36.c'
      - 'c/qwen36_strata.h'
      - 'c/qwen36_mtp*.h'
      - 'c/spec_draft.h'
      - 'c/idot.h'
      - 'c/tools/native_optimization_bench.py'
      - 'c/tools/native_moe_prefetch_bench.py'
      - 'c/olmoe.c'
      - 'c/tests/test_olmoe_cache_index.c'
      - 'c/tests/test_idot_multi_rows.c'
      - 'c/tests/test_idot_wide.c'
      - 'c/tools/*native*heads.py'
      - 'c/tools/native_decode_bench.py'
      - 'c/tools/convert_qwen36.py'
      - 'c/tests/test_*native*'
      - 'c/tests/*frontier*'
      - 'c/tests/test_qwen36_*'
      - 'c/tests/test_convert_qwen36_tied.py'
      - 'c/tests/test_convert_qwen36_mtp.py'
      - 'c/tests/test_sequential_mtp_cli.py'
      - 'c/tests/*strata*'
      - 'c/Makefile'
      - 'c/coli'
      - 'c/tools/clean.py'
      - 'c/tests/test_parallel_heads_cli.py'
      - 'c/family_registry.py'
      - 'experimental/strata/**'
      - '.github/workflows/strata-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OpenMP core and upstream draft gate regression
        env:
          OMP_NUM_THREADS: '4'
        run: make -C c strata-check
      - name: Scalar fallback
        run: make -C c strata-check-scalar
      - name: Native CPU head bank, batched readout and expert staging
        env:
          OMP_NUM_THREADS: '4'
        run: make -C c strata-native-check
      - name: Upstream generated-dependency regression
        working-directory: c
        run: python -m unittest discover -s tests -p test_makefile_deps.py -v
      - name: ASan and UBSan
        run: make -C c strata-sanitize
      - name: Native bank and kernel ASan and UBSan
        env:
          OMP_NUM_THREADS: '4'
        run: make -C c strata-native-sanitize
      - name: Seeded adversarial campaign
        run: make -C c strata-fuzz STRATA_FUZZ_CASES=100000
      - name: Coverage-guided libFuzzer
        run: make -C c strata-libfuzzer
  offline-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional CPU trainer
        run: python -m pip install -r experimental/strata/requirements-training.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install optional CPU graph runners
        run: python -m pip install -r experimental/strata/requirements-runtime.txt
      - name: Trace, identity, offset and independent-training tests
        run: make -C c strata-training-check
      - name: Tied native converter regression
        run: |
          python -m pip install safetensors numpy
          PYTHONPATH=c python -m unittest discover -s c/tests -p test_convert_qwen36_tied.py -v
          PYTHONPATH=c python -m unittest discover -s c/tests -p test_convert_qwen36_mtp.py -v
      - name: Explicit provider and TPU refusal tests
        run: make -C c strata-runtime-check
