name: Colibri graph runtime

on:
  push:
    branches: [main, 'codex/**']
    paths: ['c/*.py', 'c/coli', 'c/tests/*runtime*', 'c/tests/*stream*', 'requirements-runtime.txt', '.github/workflows/graph-runtime.yml']
  pull_request:
    paths: ['c/*.py', 'c/coli', 'c/tests/*runtime*', 'c/tests/*stream*', 'requirements-runtime.txt', '.github/workflows/graph-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependency-free runtime gate
        run: python -m unittest discover -s tests -p test_stream_runtime.py -v
      - name: Optional model and media dependencies
        run: python -m pip install -r ../requirements-runtime.txt
      - name: Manifest, lifecycle, queues and cancellation
        run: python -m unittest discover -s tests -p test_stream_runtime.py -v
      - name: Model contracts and actual CPU graph fixture
        run: python -m unittest discover -s tests -p test_stream_models.py -v
      - name: Authenticated gateway graph routes
        run: python -m unittest discover -s tests -p test_runtime_gateway.py -v
      - name: Video timestamps, audio and explicit capture
        run: python -m unittest discover -s tests -p test_runtime_cli.py -v
      - name: Native registry and packaging regression
        run: python -m unittest discover -s tests -p test_family_registry.py
      - name: Installed module closure
        run: python -m unittest discover -s tests -p test_install_closure.py
      - name: HTTP framing regression
        run: python -m unittest discover -s tests -p test_http_request_framing.py
