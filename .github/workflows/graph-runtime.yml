name: Colibri graph runtime

on:
  push:
    branches: [main, 'codex/**']
    paths: ['c/*.py', 'c/native_*', 'c/third_party/**', 'c/tools/*native*', 'c/Makefile', 'c/coli', 'c/tests/*native_graph*', 'c/tests/test_native_media.c', 'c/tests/*runtime*', 'c/tests/*stream*', 'experimental/strata/reference_stream_models.py', 'requirements-runtime.txt', 'pyproject.toml', '.github/workflows/release.yml', '.github/workflows/graph-runtime.yml']
  pull_request:
    paths: ['c/*.py', 'c/native_*', 'c/third_party/**', 'c/tools/*native*', 'c/Makefile', 'c/coli', 'c/tests/*native_graph*', 'c/tests/test_native_media.c', 'c/tests/*runtime*', 'c/tests/*stream*', 'experimental/strata/reference_stream_models.py', 'requirements-runtime.txt', 'pyproject.toml', '.github/workflows/release.yml', '.github/workflows/graph-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependency-free runtime gate
        run: python -m unittest discover -s tests -p test_stream_runtime.py -v
      - name: Native C graph client contracts
        run: python -m unittest discover -s tests -p test_native_graph_client.py -v
      - name: Native C media, backend and manifest
        if: runner.os == 'Linux'
        run: make native-graph native-graph-check
      - name: Windows native C executable
        if: runner.os == 'Windows'
        run: python tools/build_native_graph.py --check
      - name: Native PNG process admission
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_native_graph_process.py -v
      - name: Optional model and media dependencies
        run: python -m pip install -r ../requirements-runtime.txt -e "..[graph-reference]"
      - name: Manifest, lifecycle, queues and cancellation
        run: python -m unittest discover -s tests -p test_stream_runtime.py -v
      - name: Offline reference model contracts and CPU IR fixture
        run: python -m unittest discover -s tests -p test_stream_models.py -v
      - name: Authenticated gateway graph routes
        run: python -m unittest discover -s tests -p test_runtime_gateway.py -v
      - name: Video timestamps, audio and explicit capture
        run: python -m unittest discover -s tests -p test_runtime_cli.py -v
      - name: Native registry and packaging regression
        run: python -m unittest discover -s tests -p test_family_registry.py
      - name: Installed module closure
        run: python -m unittest discover -s tests -p test_install_closure.py
      - name: HTTP framing regression
        run: python -m unittest discover -s tests -p test_http_request_framing.py
