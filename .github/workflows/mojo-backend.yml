name: Native Mojo backend
on:
  push:
    branches: [main, 'codex/**']
    paths: ['c/native_mojo_*', 'c/mojo_*', 'c/runtime_split*', 'c/vk_tier*', 'c/backend_vulkan.c', 'c/olmoe.c', 'c/qwen36.c', 'c/Makefile', 'c/coli', 'c/tools/*mojo*', 'c/tools/native_moe_split_bench.py', 'c/tests/*mojo*', 'c/tests/test_native_moe_split_bench.py', 'c/tests/test_vk_tier.c', '.github/workflows/mojo-backend.yml']
  pull_request:
    paths: ['c/native_mojo_*', 'c/mojo_*', 'c/runtime_split*', 'c/vk_tier*', 'c/backend_vulkan.c', 'c/olmoe.c', 'c/qwen36.c', 'c/Makefile', 'c/coli', 'c/tools/*mojo*', 'c/tools/native_moe_split_bench.py', 'c/tests/*mojo*', 'c/tests/test_native_moe_split_bench.py', 'c/tests/test_vk_tier.c', '.github/workflows/mojo-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SDK-free launcher and installed closure
        run: |
          python -m unittest discover -s c/tests -p test_mojo_cli.py -v
          python -m unittest discover -s c/tests -p test_native_moe_split_bench.py -v
          python -m unittest discover -s c/tests -p test_install_closure.py -v
      - name: Pinned native SDK
        run: python -m pip install max==26.6.0
      - name: Build native C backend
        run: python c/tools/build_native_mojo.py
      - name: Prepare offline graph fixtures
        run: |
          python c/tools/prepare_mojo_fixture.py --output outputs-native/mojo-fixtures/f32
          python c/tools/prepare_mojo_fixture.py --integer-bits 4 --output outputs-native/mojo-fixtures/i4
          python c/tools/prepare_mojo_fixture.py --integer-bits 8 --output outputs-native/mojo-fixtures/i8
          python c/tools/prepare_mojo_fixture.py --integer-bits 16 --output outputs-native/mojo-fixtures/i16
          python c/tools/prepare_mojo_fixture.py --external-weights --output outputs-native/mojo-fixtures/weighted
      - name: Actual native inference and explicit-device refusal
        run: python c/tools/check_native_mojo.py --fixtures outputs-native/mojo-fixtures --output outputs-native/mojo-replay
      - name: C ownership, bounds and SDK failure checks
        run: |
          python c/tools/build_native_mojo.py --test --sanitize --output outputs-native/mojo-sanitize
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 outputs-native/mojo-sanitize outputs-native/mojo-fixtures/f32/model.mef
      - name: Native CLI hardware probe
        run: python c/coli mojo probe
      - name: Compile native Mojo common dispatch
        run: |
          python -m unittest discover -s c/tests -p test_build_mojo_dispatch.py -v
          python c/tools/build_mojo_dispatch.py
          make -C c runtime-split-check
          cc -std=c17 -O2 -Wall -Wextra -Werror c/tests/test_mojo_dispatch.c c/mojo_split_loader.c c/runtime_split.c -ldl -o outputs-native/test-mojo-dispatch
          cc -std=c17 -Wall -Wextra -Werror -fPIC -shared -DCOLI_MOJO_TEST_WRONG_ABI c/tests/test_mojo_dispatch.c -o outputs-native/mojo-wrong-abi.so
          cc -std=c17 -Wall -Wextra -Werror -fPIC -shared -DCOLI_MOJO_TEST_MISSING_SYMBOLS c/tests/test_mojo_dispatch.c -o outputs-native/mojo-missing-symbols.so
          cc -std=c17 -Wall -Wextra -Werror -fPIC -shared -DCOLI_MOJO_TEST_BAD_INIT c/tests/test_mojo_dispatch.c -o outputs-native/mojo-bad-init.so
          outputs-native/test-mojo-dispatch c/libcoli_mojo_dispatch.so outputs-native/mojo-wrong-abi.so outputs-native/mojo-missing-symbols.so outputs-native/mojo-bad-init.so
      - name: Native Mojo-controlled Vulkan split and join
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslc
          make -C c tests/test_vk_tier tests/test_olmoe_moe_by_expert VK=1
          c/tests/test_olmoe_moe_by_expert
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          VK_ICD_FILENAMES="$icd" COLI_MOJO_DISPATCH="$PWD/c/libcoli_mojo_dispatch.so" c/tests/test_vk_tier c/shaders/qmatmul.spv > outputs-native/mojo-vulkan-functional.log 2>&1
          tail -n 15 outputs-native/mojo-vulkan-functional.log
          cc -std=gnu17 -O1 -g -march=native -fopenmp -pthread -DCOLI_VULKAN -fsanitize=address,undefined -fno-omit-frame-pointer c/tests/test_vk_tier.c c/backend_vulkan.c c/vk_tier.c c/runtime_split.c c/mojo_split_loader.c c/vk_chain.c -ldl -lm -o outputs-native/mojo-vulkan-sanitize
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 VK_ICD_FILENAMES="$icd" COLI_MOJO_DISPATCH="$PWD/c/libcoli_mojo_dispatch.so" outputs-native/mojo-vulkan-sanitize c/shaders/qmatmul.spv > outputs-native/mojo-vulkan-sanitize.log 2>&1
          tail -n 15 outputs-native/mojo-vulkan-sanitize.log
      - uses: actions/upload-artifact@v4
        with:
          name: native-mojo-cpu-evidence
          path: |
            outputs-native/mojo-replay/report.json
            outputs-native/mojo-vulkan-functional.log
            outputs-native/mojo-vulkan-sanitize.log
